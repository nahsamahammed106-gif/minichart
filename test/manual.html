<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>mc test</title>
<style>body{font-family:system-ui;margin:20px;color:#222;background:#fff}.c{margin-bottom:30px;border:1px solid #ddd;padding:10px}
:root[data-theme=dark]{color-scheme:dark}:root[data-theme=dark] body{background:#111;color:#ddd}</style></head>
<body>
<div id="a" class="c"></div><div id="b" class="c"></div><div id="d" class="c"></div>
<div dir="rtl" lang="ar"><div id="e" class="c"></div></div>
<script src="../src/minichart.js"></script>
<script>
window.errors=[];window.onerror=(m)=>errors.push(m);
let s=7;const r=()=>(s=s*16807%2147483647)/2147483647;
const days=Array.from({length:365},(_,i)=>new Date(2026,0,1+i).toLocaleDateString('en',{month:'short',day:'numeric'}));
let v=500,w=80;
window.A=MiniChart('#a',{title:'Visitors',labels:days,series:[{name:'Visits',data:days.map(()=>v=Math.max(50,v+(r()-.5)*80))},{name:'RSVPs',data:days.map((_,i)=>i===100?null:w=Math.max(5,w+(r()-.5)*20))}]});
const m=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
window.B=MiniChart('#b',{type:'bar',title:'Events',labels:m,series:['Exhibitions','Talks','Workshops'].map(n=>({name:n,data:m.map(()=>Math.round(r()*40-5))}))});
let z=0;window.D=MiniChart('#d',{type:'area',title:'Sensor',series:[{name:'Signal',data:Array.from({length:100000},(_,i)=>z+=r()-.5)}]});
const am=['يناير','فبراير','مارس','أبريل','مايو','يونيو'];const af=new Intl.NumberFormat('ar-AE');
window.E=MiniChart('#e',{sound:true,title:'الزوار',labels:am,format:x=>af.format(Math.round(x)),series:[{name:'الزوار',data:[120,340,280,500,460,610]},{name:'الفعاليات',data:[40,60,90,70,120,150]}]});
</script></body></html>
