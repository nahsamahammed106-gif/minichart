<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniChart smoke test</title>
<style>
  body { font: 14px system-ui; margin: 20px; color: #222; background: #fff }
  .box { width: 600px; margin-bottom: 16px }
  #out li.fail { color: #c00 } #out li.pass { color: #080 }
</style>
</head>
<body>
<h1>MiniChart smoke test</h1>
<p id="sum">running…</p>
<ol id="out"></ol>
<div id="stage"></div>
<div dir="rtl" id="rtlstage"></div>
<script src="../src/minichart.js"></script>
<script>
const errors = [];
addEventListener('error', e => errors.push(e.message));
const wait = (ms = 40) => new Promise(r => setTimeout(r, ms));
const frames = () => new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
const results = [];
function box(parent = 'stage') { const d = document.createElement('div'); d.className = 'box'; document.getElementById(parent).append(d); return d; }
const pick = el => ({ plot: el.querySelector('.mc-plot'), tip: el.querySelector('.mc-tip'), live: el.querySelector('[aria-live]') });
function P(el, type, x, o = {}) {
  const plot = el.querySelector('.mc-plot'), r = plot.getBoundingClientRect();
  plot.dispatchEvent(new PointerEvent(type, { bubbles: true, cancelable: true, clientX: r.left + x, clientY: r.top + 80, pointerId: o.id || 1, pointerType: o.type || 'mouse', button: o.button ?? 0, buttons: o.buttons ?? 0, shiftKey: !!o.shift }));
}
const key = (el, k) => el.dispatchEvent(new KeyboardEvent('keydown', { key: k, bubbles: true }));
const head = el => pick(el).tip.innerText.split('\n')[0];
async function leftLabel(el) { P(el, 'pointermove', 1); await frames(); const h = head(el); P(el, 'pointerleave', 0); return h; }
async function test(name, fn) {
  try { const r = await fn(); if (r !== true) throw new Error('got ' + JSON.stringify(r)); results.push({ name, ok: true }); }
  catch (e) { results.push({ name, ok: false, err: String(e.message || e) }); }
}
const series = (n, f = i => Math.sin(i / 5) * 50 + 60) => Array.from({ length: n }, (_, i) => f(i));
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
// Shared CI machines are slower and noisier than a laptop: give timing tests 3x headroom there (test/run.mjs adds ?ci).
const SLOW = /[?&]ci\b/.test(location.search) ? 3 : 1;
// Time redraws synchronously, so numbers stay real even when the page runs in the background (rAF throttled).
function drawCost(run) {
  const raf0 = window.requestAnimationFrame; let total = 0, n = 0;
  window.requestAnimationFrame = f => { const t = performance.now(); f(t); total += performance.now() - t; n++; return 0; };
  try { run(); } finally { window.requestAnimationFrame = raf0; }
  return n ? total / n : Infinity;
}

(async () => {
  await test('line, area, bar render without errors', async () => {
    for (const type of ['line', 'area', 'bar']) MiniChart(box(), { type, series: [{ name: 'A', data: series(30) }] });
    await wait(700);
    return errors.length === 0 || errors;
  });

  await test('CSS added once for many charts (constructable sheet)', async () => document.adoptedStyleSheets.length === 1 && !document.querySelector('style#mc-css'));

  await test('no series / empty data does not throw', async () => {
    MiniChart(box(), {}); MiniChart(box(), { series: [] }); MiniChart(box(), { series: [{ data: [] }] });
    await frames(); return errors.length === 0 || errors;
  });

  await test('single point line: tooltip positioned (no NaN)', async () => {
    const el = box(); MiniChart(el, { labels: ['Only'], series: [{ name: 'A', data: [5] }] });
    await wait(700); P(el, 'pointermove', 300); await frames();
    const { tip } = pick(el);
    return (head(el) === 'Only' && !tip.style.left.includes('NaN')) || [head(el), tip.style.left];
  });

  await test('all-null series renders, tooltip shows –', async () => {
    const el = box(); MiniChart(el, { labels: ['a', 'b', 'c'], series: [{ name: 'N', data: [null, null, null] }] });
    await frames(); P(el, 'pointermove', 300); await frames();
    return pick(el).tip.innerText.includes('–') || pick(el).tip.innerText;
  });

  await test('labels shorter than data: no "undefined"', async () => {
    const el = box(); MiniChart(el, { labels: ['a'], series: [{ name: 'A', data: [1, 2, 3] }] });
    await frames(); return !el.innerHTML.includes('undefined');
  });

  await test('HTML in names/labels is escaped (no XSS)', async () => {
    const bad = '<img src=x onerror="window.pwned=1">';
    const el = box(); MiniChart(el, { title: bad, labels: [bad, bad], series: [{ name: bad, data: [1, 2] }] });
    await frames(); P(el, 'pointermove', 100); await frames(); await wait(100);
    return (!el.querySelector('img') && !window.pwned) || 'img found';
  });

  await test('10 series: legend has 10 entries, colours cycle', async () => {
    const el = box(); MiniChart(el, { series: Array.from({ length: 10 }, (_, i) => ({ name: 'S' + i, data: series(10) })) });
    await frames();
    const sw = [...el.querySelectorAll('[data-i] i')].map(i => i.style.background);
    return (sw.length === 10 && sw[0] === sw[8] && sw[0] !== sw[1]) || sw;
  });

  await test('update() with new length resets view and animates without errors', async () => {
    const el = box(); const c = MiniChart(el, { series: [{ name: 'A', data: series(50) }] });
    key(el, '+'); key(el, '+'); await frames();
    c.update({ series: [{ name: 'A', data: series(200) }] }); await wait(700);
    return (await leftLabel(el)) === '0' || await leftLabel(el);
  });

  await test('hiding every series: no errors, tooltip shows only label', async () => {
    const el = box(); MiniChart(el, { series: [{ name: 'A', data: series(10) }, { name: 'B', data: series(10) }] });
    el.querySelectorAll('[data-i]').forEach(b => b.click()); await frames();
    P(el, 'pointermove', 300); await frames();
    return (pick(el).tip.innerText.split('\n').length === 1 && errors.length === 0) || pick(el).tip.innerText;
  });

  await test('keyboard: + zooms, 0 resets, Escape hides tooltip, live region speaks', async () => {
    const el = box(); MiniChart(el, { series: [{ name: 'A', data: series(100) }] }); await wait(700);
    key(el, '+'); key(el, '+'); await frames(); const z = await leftLabel(el);
    key(el, '0'); await frames(); const r = await leftLabel(el);
    key(el, 'ArrowRight'); await wait(120); const spoken = pick(el).live.textContent;
    key(el, 'Escape'); await frames();
    return (z !== '0' && r === '0' && spoken.includes('A') && pick(el).tip.style.opacity === '0') || [z, r, spoken];
  });

  await test('right-click does not start a drag', async () => {
    const el = box(); MiniChart(el, { series: [{ name: 'A', data: series(100) }] }); await wait(700);
    key(el, '+'); await frames(); const before = await leftLabel(el);
    P(el, 'pointerdown', 300, { button: 2, buttons: 2 }); P(el, 'pointermove', 100, { buttons: 2 }); P(el, 'pointerup', 100, { button: 2 });
    await frames();
    return before === await leftLabel(el) || 'moved';
  });

  await test('touch tap shows tooltip', async () => {
    const el = box(); MiniChart(el, { labels: ['a', 'b', 'c', 'd'], series: [{ name: 'A', data: [1, 2, 3, 4] }] }); await wait(700);
    P(el, 'pointerdown', 300, { type: 'touch', buttons: 1 }); await frames();
    const shown = pick(el).tip.style.opacity === '1';
    P(el, 'pointerup', 300, { type: 'touch' });
    return shown || 'no tooltip';
  });

  await test('two-finger pinch zooms in', async () => {
    const el = box(); MiniChart(el, { series: [{ name: 'A', data: series(400) }] }); await wait(700);
    P(el, 'pointerdown', 250, { id: 11, type: 'touch', buttons: 1 }); P(el, 'pointerdown', 350, { id: 12, type: 'touch', buttons: 1 });
    for (let k = 1; k <= 6; k++) { P(el, 'pointermove', 250 - k * 20, { id: 11, type: 'touch', buttons: 1 }); P(el, 'pointermove', 350 + k * 20, { id: 12, type: 'touch', buttons: 1 }); }
    P(el, 'pointerup', 130, { id: 11, type: 'touch' }); P(el, 'pointerup', 470, { id: 12, type: 'touch' }); await frames();
    const l = await leftLabel(el);
    return +l > 30 || l;
  });

  await test('shift-drag measure with a null endpoint shows –', async () => {
    const el = box(); MiniChart(el, { labels: ['a', 'b', 'c', 'd', 'e'], series: [{ name: 'A', data: [1, null, 3, 4, 8] }] }); await wait(700);
    const w = el.querySelector('.mc-plot').clientWidth;
    P(el, 'pointerdown', 60, { shift: true, buttons: 1 }); P(el, 'pointermove', w * 0.3, { buttons: 1 }); P(el, 'pointerup', w * 0.3); await frames();
    const a = pick(el).tip.innerText;
    P(el, 'pointerdown', 60, { shift: true, buttons: 1 }); P(el, 'pointermove', w - 15, { buttons: 1 }); P(el, 'pointerup', w - 15); await frames();
    const b = pick(el).tip.innerText;
    return (a.includes('–') && b.includes('▲') && b.includes('700.0%')) || [a, b];
  });

  await test('tooltip stays inside the plot at the right edge', async () => {
    const el = box(); MiniChart(el, { labels: series(20, i => 'A long label number ' + i), series: [{ name: 'A rather long series name', data: series(20) }] }); await wait(700);
    const { plot, tip } = pick(el); P(el, 'pointermove', plot.clientWidth - 14); await frames();
    return parseFloat(tip.style.left) + tip.offsetWidth <= plot.clientWidth || [tip.style.left, tip.offsetWidth];
  });

  await test('negative bars: tooltip shows negative value', async () => {
    const el = box(); MiniChart(el, { type: 'bar', labels: ['a', 'b'], series: [{ name: 'A', data: [-5, 3] }] }); await wait(700);
    P(el, 'pointermove', 150); await frames();
    return pick(el).tip.innerText.includes('-5') || pick(el).tip.innerText;
  });

  await test('RTL: leftmost point is the last label', async () => {
    const el = box('rtlstage'); MiniChart(el, { labels: ['أ', 'ب', 'ج'], series: [{ name: 'س', data: [1, 2, 3] }] }); await wait(700);
    return (await leftLabel(el)) === 'ج' || await leftLabel(el);
  });

  await test('resizing the container resizes the canvas', async () => {
    const el = box(); MiniChart(el, { series: [{ name: 'A', data: series(10) }] }); await frames();
    el.style.width = '300px'; await wait(100);
    return el.querySelector('canvas').width === Math.round(el.querySelector('.mc-plot').clientWidth * devicePixelRatio) || el.querySelector('canvas').width;
  });

  await test('accessibility: figure role, label, focusable, data table, canvas hidden', async () => {
    const el = box(); MiniChart(el, { title: 'Sales', labels: ['a', 'b'], series: [{ name: 'A', data: [1, 2] }] }); await frames();
    return (el.getAttribute('role') === 'figure' && el.getAttribute('aria-label').startsWith('Sales. line chart, 2 points') && el.tabIndex === 0
      && el.querySelectorAll('table tr').length === 3 && el.querySelector('canvas').getAttribute('aria-hidden') === 'true') || el.getAttribute('aria-label');
  });

  await test('PNG export: valid image, canvas size, opaque background', async () => {
    const el = box(); MiniChart(el, { title: 'export', series: [{ name: 'A', data: series(10) }] }); await wait(700);
    let href, name; const orig = HTMLAnchorElement.prototype.click;
    HTMLAnchorElement.prototype.click = function () { href = this.href; name = this.download; };
    el.querySelector('[data-t=png]').click(); HTMLAnchorElement.prototype.click = orig;
    const img = new Image(); img.src = href; await img.decode();
    const c = document.createElement('canvas'); c.width = img.width; c.height = img.height; const g = c.getContext('2d'); g.drawImage(img, 0, 0);
    const corner = g.getImageData(1, 1, 1, 1).data, cv = el.querySelector('canvas');
    return (name === 'export.png' && href.startsWith('data:image/png') && img.width === cv.width && corner[3] === 255) || [name, img.width, cv.width, [...corner]];
  });

  await test('big data: 100k points zoom redraw under 50 ms', async () => {
    let z = 0; const el = box(); MiniChart(el, { type: 'area', animate: false, series: [{ name: 'A', data: Array.from({ length: 100000 }, () => z += Math.random() - .5) }] });
    await wait(1500); const ms = drawCost(() => { for (let k = 0; k < 5; k++) { key(el, '+'); key(el, '-'); } }); // average 10 redraws
    return ms < 50 * SLOW || ms;
  });

  await test('destroy() cleans up the element', async () => {
    const el = box(); const c = MiniChart(el, { series: [{ name: 'A', data: [1, 2] }] }); c.destroy();
    key(el, '+');
    return (el.innerHTML === '' && !el.classList.contains('mc') && !el.hasAttribute('tabindex')) || el.outerHTML.slice(0, 120);
  });

  await test('touch long-press then drag measures; quick drag still pans', async () => {
    const el = box(); MiniChart(el, { labels: ['a', 'b', 'c', 'd', 'e'], series: [{ name: 'A', data: [1, 2, 3, 4, 8] }] }); await wait(700);
    const w = el.querySelector('.mc-plot').clientWidth;
    P(el, 'pointerdown', 60, { id: 21, type: 'touch', buttons: 1 }); await wait(550);
    P(el, 'pointermove', w - 15, { id: 21, type: 'touch', buttons: 1 }); P(el, 'pointerup', w - 15, { id: 21, type: 'touch' }); await frames();
    const t = pick(el).tip.innerText;
    return (t.includes('a → e') && t.includes('▲')) || t;
  });

  await test('touch targets are at least 24px (WCAG 2.5.8)', async () => {
    const el = box(); MiniChart(el, { series: [{ name: 'A', data: [1, 2] }] }); await frames();
    const sizes = [...el.querySelectorAll('.mc-leg button')].map(b => { const r = b.getBoundingClientRect(); return Math.min(r.width, r.height); });
    return sizes.every(s => s >= 24) || sizes;
  });

  await test('tooltip is hidden from screen readers (live region speaks instead)', async () => {
    const el = box(); MiniChart(el, { series: [{ name: 'A', data: [1, 2] }] });
    return el.querySelector('.mc-tip').getAttribute('aria-hidden') === 'true';
  });

  await test('prefers-reduced-motion: no animation frames after first draw', async () => {
    await wait(800); // let earlier charts finish their intro animation
    const mm = window.matchMedia, raf = window.requestAnimationFrame; let calls = 0;
    window.matchMedia = q => q.includes('reduced-motion') ? { matches: true, addEventListener() {}, removeEventListener() {} } : mm.call(window, q);
    const el = box(); const c = MiniChart(el, { series: [{ name: 'A', data: series(50) }] });
    window.matchMedia = mm;
    await frames(); await frames();
    window.requestAnimationFrame = f => (calls++, raf(f));
    c.update({ series: [{ name: 'A', data: series(50, i => i * 3) }] });
    await wait(300); window.requestAnimationFrame = raf;
    return calls <= 1 || calls;
  });

  // ---- pass 3: security ----
  await test('SEC: custom format() output is escaped', async () => {
    const el = box(); MiniChart(el, { labels: ['a', 'b'], format: v => '<img src=x onerror="window.pwned2=1">' + v, series: [{ name: 'A', data: [1, 2] }] });
    await frames(); P(el, 'pointermove', 300); await frames(); await wait(50);
    return (!el.querySelector('img') && !window.pwned2 && pick(el).tip.innerText.includes('<img')) || 'not escaped';
  });

  await test('SEC: junk data (strings, NaN, Infinity, objects) is dropped, axis stays finite', async () => {
    const el = box(); MiniChart(el, { series: [{ name: 'A', data: [1, '2', NaN, Infinity, -Infinity, '<b>', {}, '', null, 5] }] });
    await wait(700); P(el, 'pointermove', 1); await frames();
    const t = el.querySelector('table').innerText;
    return (errors.length === 0 && !/NaN|Infinity/.test(t) && t.includes('2')) || t;
  });

  await test('ROBUST: BigInt and Symbol data do not crash', async () => {
    const el = box(); MiniChart(el, { series: [{ name: 'A', data: [1n, 5n, Symbol('x'), 3] }] }); await frames();
    const t = el.querySelector('table').innerText;
    return (errors.length === 0 && t.includes('5') && t.includes('–')) || [errors, t];
  });

  await test('SEC: huge values with tiny range do not freeze the page', async () => {
    const els = [[1e300, 1e300 + 1e284, 1e300], [Number.MAX_VALUE, -Number.MAX_VALUE], [1e-300, 2e-300]].map(data => {
      const el = box(); MiniChart(el, { animate: false, series: [{ name: 'A', data }] }); return el;
    });
    await wait(1500); // first size measurement
    const ms = drawCost(() => els.forEach(el => key(el, '+')));
    return (ms < 50 * SLOW && errors.length === 0) || [ms, errors];
  });

  await test('SEC: colour cannot inject CSS; invalid colour falls back to palette', async () => {
    const el = box(); MiniChart(el, { series: [{ name: 'A', color: 'red;background:url(https://evil.test/x)', data: [1, 2] }, { name: 'B', color: 'tomato', data: [2, 3] }] });
    await frames();
    const [a, b] = [...el.querySelectorAll('.mc-leg [data-i] i')].map(i => i.style.background);
    return (!el.innerHTML.includes('evil') && a === 'rgb(59, 130, 246)' && b === 'rgb(255, 99, 71)') || [a, b];
  });

  await test('SEC: transparent rgba colour in area chart does not crash', async () => {
    const el = box(); MiniChart(el, { type: 'area', series: [{ name: 'A', color: 'rgba(255,0,0,.5)', data: [1, 3, 2] }] });
    await wait(700); return errors.length === 0 || errors;
  });

  await test('SEC: missing element gives a clear error', async () => {
    try { MiniChart('#does-not-exist', {}); return 'no throw'; } catch (e) { return e.message === 'MiniChart: element not found' || e.message; }
  });

  await test('SEC: update/destroy after destroy are harmless', async () => {
    const el = box(); const c = MiniChart(el, { series: [{ name: 'A', data: series(20) }] }); await frames();
    c.destroy(); c.destroy(); c.update({ series: [{ data: [1] }] }); await wait(200);
    return (el.innerHTML === '' && errors.length === 0) || [el.innerHTML.length, errors];
  });

  await test('no sound button anywhere', async () => {
    const el = box(); MiniChart(el, { sound: true, series: [{ name: 'A', data: [1, 2] }] }); await frames();
    return (!el.querySelector('[data-t=play]') && !!el.querySelector('[data-t=png]')) || 'play button found';
  });

  await test('PERF: hovering 50k bars stays under 20 ms per redraw', async () => {
    let z = 0; const el = box(); MiniChart(el, { type: 'bar', animate: false, series: [{ name: 'A', data: Array.from({ length: 50000 }, () => z += Math.random() - .5) }] });
    await wait(1500); const ms = drawCost(() => { for (let k = 0; k < 20; k++) P(el, 'pointermove', 100 + k * 10); });
    return ms < 20 * SLOW || ms;
  });

  // ---- pass 5: API edge cases ----
  await test('API: switching type at runtime (line → bar → area)', async () => {
    const el = box(); const c = MiniChart(el, { series: [{ name: 'A', data: series(12) }] }); await frames();
    c.update({ type: 'bar' }); await wait(100); c.update({ type: 'area' }); await wait(700);
    P(el, 'pointermove', 300); await frames();
    return (errors.length === 0 && pick(el).tip.style.opacity === '1') || errors;
  });

  await test('API: update keeps hidden series hidden and zoom when length unchanged', async () => {
    const el = box(); const c = MiniChart(el, { series: [{ name: 'A', data: series(100) }, { name: 'B', data: series(100) }] }); await wait(700);
    el.querySelector('[data-i="1"]').click(); key(el, '+'); key(el, '+'); await frames(); const z = await leftLabel(el);
    c.update({ series: [{ name: 'A', data: series(100, i => i) }, { name: 'B', data: series(100) }] }); await wait(700);
    return (el.querySelector('[data-i="1"]').getAttribute('aria-pressed') === 'false' && await leftLabel(el) === z) || 'lost state';
  });

  await test('API: RTL arrow keys move visually (← goes forward in time)', async () => {
    const el = box('rtlstage'); MiniChart(el, { labels: ['a', 'b', 'c', 'd', 'e'], series: [{ name: 'A', data: [1, 2, 3, 4, 5] }] }); await wait(700);
    key(el, 'ArrowLeft'); await frames(); const first = head(el); key(el, 'ArrowLeft'); await frames();
    return head(el) > first || [first, head(el)];
  });

  await test('API: --mc-tip-bg variable themes the tooltip', async () => {
    const el = box(); el.style.setProperty('--mc-tip-bg', 'rgb(1, 2, 3)'); MiniChart(el, { series: [{ name: 'A', data: [1, 2] }] });
    return getComputedStyle(el.querySelector('.mc-tip')).backgroundColor === 'rgb(1, 2, 3)';
  });

  await test('destroy() keeps the host page\'s own onkeydown handler', async () => {
    const el = box(); const mine = () => {}; el.onkeydown = mine;
    MiniChart(el, { series: [{ name: 'A', data: [1, 2] }] }).destroy();
    return el.onkeydown === mine;
  });

  await test('null entries in series are ignored', async () => {
    const el = box(); MiniChart(el, { series: [null, { name: 'A', data: [1, 2] }, undefined, { name: 'B', data: [2, 1] }] }); await frames();
    return (errors.length === 0 && el.querySelectorAll('[data-i]').length === 2) || errors;
  });

  await test('keyboard announcement is correct even when redraws are delayed', async () => {
    const el = box(); MiniChart(el, { labels: ['a', 'b', 'c', 'd', 'e'], series: [{ name: 'A', data: [1, 2, 3, 4, 5] }] }); await wait(800);
    const raf = window.requestAnimationFrame; window.requestAnimationFrame = () => 0; // freeze redraws
    try { key(el, 'ArrowRight'); const first = pick(el).live.textContent; key(el, 'ArrowRight'); const second = pick(el).live.textContent;
      return (first.startsWith('c') && second.startsWith('d')) || [first, second]; }
    finally { window.requestAnimationFrame = raf; }
  });

  await test('dark page (light text) switches to the dark palette and back', async () => {
    const el = box(); el.style.color = 'rgb(230, 235, 240)';
    MiniChart(el, { series: [{ name: 'A', data: [1, 2] }, { name: 'B', data: [2, 3] }] }); await frames();
    const darkSw = el.querySelectorAll('.mc-leg [data-i] i')[1].style.background;
    el.style.color = 'rgb(20, 30, 50)'; document.documentElement.setAttribute('data-x', Date.now()); await frames();
    const lightSw = el.querySelectorAll('.mc-leg [data-i] i')[1].style.background;
    return (darkSw === 'rgb(217, 119, 6)' && lightSw === 'rgb(245, 158, 11)') || [darkSw, lightSw];
  });

  await test('bar charts accept one colour per bar', async () => {
    const el = box(); MiniChart(el, { type: 'bar', animate: false, series: [{ name: 'A', data: [5, 5], colors: ['#ff0000', null] }] }); await frames(); await frames();
    const c = el.querySelector('canvas'), g = c.getContext('2d'), w = c.width, h = c.height;
    const px = x => [...g.getImageData(Math.round(x * w), Math.round(h * 0.6), 1, 1).data].slice(0, 3).join(',');
    let red = 0, other = 0;
    for (let f = 0.15; f < 0.95; f += 0.01) { const p = px(f); if (p === '255,0,0') red++; else if (p === '59,130,246') other++; }
    return (red > 3 && other > 3) || [red, other];
  });

  await test('single series: no legend entry, tools still there', async () => {
    const el = box(); MiniChart(el, { series: [{ name: 'Only', data: [1, 2] }] }); await frames();
    return (!el.querySelector('.mc-leg [data-i]') && !!el.querySelector('[data-t=png]')) || el.querySelector('.mc-leg').innerHTML;
  });

  await test('format: null falls back to the default formatter', async () => {
    const el = box(); const c = MiniChart(el, { labels: ['a', 'b'], series: [{ name: 'A', data: [1200, 2] }] });
    c.update({ format: null }); await frames(); P(el, 'pointermove', 1); await frames();
    return (errors.length === 0 && pick(el).tip.innerText.toLowerCase().includes('1.2k')) || [errors, pick(el).tip.innerText];
  });

  await test('hidden data table adds no blank space to the page', async () => {
    const el = box(); MiniChart(el, { series: [{ name: 'A', data: series(2000) }] }); await frames();
    const sr = el.querySelector('table').parentElement.getBoundingClientRect();
    return (el.querySelectorAll('table tr').length === 501 && sr.height <= 1 && el.scrollHeight <= el.clientHeight + 2) || [sr.height, el.scrollHeight, el.clientHeight];
  });

  await test('no uncaught errors overall', async () => errors.length === 0 || errors);

  const fails = results.filter(r => !r.ok);
  document.getElementById('sum').textContent = `${results.length - fails.length}/${results.length} passed${reduced ? ' (reduced motion)' : ''}`;
  document.getElementById('out').innerHTML = results.map(r => `<li class="${r.ok ? 'pass' : 'fail'}">${r.ok ? '✓' : '✗'} ${r.name}${r.ok ? '' : ' — ' + r.err.replace(/</g, '&lt;')}</li>`).join('');
  window.smoke = { passed: results.length - fails.length, total: results.length, fails };
})();
</script>
