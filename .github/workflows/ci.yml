name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Size limit (12 KB gzipped)
        run: |
          size=$(npm run -s size)
          echo "minichart.js: $size bytes gzipped"
          test "$size" -le 12288
      - name: Browser tests (headless Chrome)
        run: node test/run.mjs
