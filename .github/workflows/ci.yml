name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Size limit (12 KB gzipped)
        run: |
          size=$(npm run -s size)
          echo "minichart.js: $size bytes gzipped"
          test "$size" -le 12288
      - name: Browser tests (headless Chrome)
        run: node test/run.mjs
